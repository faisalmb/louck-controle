# Tests on Windows, macOS and Linux on every push / PR.
# A push to main whose version (src/lockcontrol/__init__.py) has no release yet builds all three
# apps and publishes them as Release v<version>. Pushing a v* tag does the same.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  # Qt without a display (tests, icon generation)
  QT_QPA_PLATFORM: offscreen

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # tags are needed to know if this version was already released
      - id: check
        run: |
          tag="v$(python3 packaging/build.py --version)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            release=true
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] \
               && ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            release=true
          else
            release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version tag: $tag, release: $release"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: [version, test]
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: |
              dist/LockControl-Setup-*.exe
              dist/LockControl-*-windows-portable.zip
          - os: macos-latest
            artifacts: dist/LockControl-*-macos.dmg
          - os: ubuntu-22.04
            artifacts: dist/LockControl-*-linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[build]"

      - name: Build (Windows, with installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./build.ps1
      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        run: python packaging/build.py

      - uses: actions/upload-artifact@v6
        with:
          name: LockControl-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      # Creates the tag on this commit if it doesn't exist yet
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: LockControl ${{ needs.version.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
